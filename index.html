<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYNIT DIGITAL</title>
    <style>
        * { margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; }
        header {
            background: linear-gradient(135deg, #FF6B00 0%, #000 100%);
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            border-bottom: 4px solid #FFD700;
        }
        header h1 { font-size: 3.5rem; color: #FFD700; margin-bottom: 15px; text-shadow: 3px 3px 6px #000; }
        header p { font-size: 1.3rem; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 18px 35px; background: #FFD700; color: #000; text-decoration: none; font-weight: bold; border-radius: 10px; }
        section { padding: 80px 20px; max-width: 1100px; margin: auto; }
        h2 { color: #FFD700; text-align: center; margin-bottom: 50px; font-size: 2.5rem; }
        .services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .card { background: #1a1a1a; padding: 30px; border-radius: 15px; border: 2px solid #FFD700; text-align: center; }
        @media(max-width: 768px) { .services { grid-template-columns: 1fr; } header h1 { font-size: 2.2rem; }
    </style>
</head>
<body>
    <header>
        <h1>KYNIT DIGITAL</h1>
        <p>We Build Digital Websites That Make You Money</p>
        <a href="https://wa.me/234" class="btn">Get Your Website Now</a>
    </header>
    <section>
        <h2>OUR SERVICES</h2>
        <div class="services">
            <div class="card"><h3>Website Design</h3><p>From ₦150,000</p></div>
            <div class="card"><h3>Branding</h3><p>From ₦80,000</p></div>
            <div class="card"><h3>Digital Growth</h3><p>From ₦100,000/mo</p></div>
        </div>
    </section>
</body>
</html>
