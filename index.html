<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYNIT DIGITAL</title>
    <style>
        * { margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; }
        
        header {
            background: #0a0a0a;
            text-align: center;
            padding: 100px 20px;
            border-bottom: 3px solid #FFD700;
        }
        header h1 {
            font-size: 3rem;
            color: #FFD700;
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #FFD700;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }
        section { padding: 60px 20px; max-width: 1000px; margin: auto; }
        h2 { color: #FFD700; text-align: center; margin-bottom: 30px; }
        
        .services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 10px; border: 1px solid #FFD700; }
        
        @media(max-width: 768px) {
            .services { grid-template-columns: 1fr; }
            header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>KYNIT DIGITAL</h1>
        <p>We Build Digital Websites That Make You Money</p>
        <a href="https://wa.me/234" class="btn">Get Your Website Now</a>
    </header>
    
    <section>
        <h2>OUR SERVICES</h2>
        <div class="services">
            <div class="card">
                <h3>Website Design</h3>
                <p>From ₦150,000</p>
            </div>
            <div class="card">
                <h3>Branding</h3>
                <p>From ₦80,000</p>
            </div>
            <div class="card">
                <h3>Digital Growth</h3>
                <p>From ₦100,000/mo</p>
            </div>
        </div>
    </section>
</body>
</html>
