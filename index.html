<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYNIT DIGITAL - We Build Websites That Make You Money | Lagos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        
        /* NAV */
        nav{background:#000; padding:20px; text-align:center; border-bottom:2px solid #FFD700; position: sticky; top:0; z-index:100;}
        nav a{color:#FFD700; text-decoration:none; margin:0 15px; font-weight:bold; font-size:1.1rem;}
        nav a:hover{color:#fff;}

        /* HEADER WITH YOUR DESK IMAGE */
        header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('IMG_5159.jpeg') no-repeat center;
            background-size: cover;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }
        header h1 { font-size: 3.5rem; color: #FFD700; margin-bottom: 15px; text-shadow: 3px 3px 6px #000; }
        header p { font-size: 1.3rem; margin-bottom: 30px; text-shadow: 2px 2px 4px #000; max-width: 700px; }
        .btn { display: inline-block; padding: 18px 35px; background: #FFD700; color: #000; text-decoration: none; font-weight: bold; border-radius: 10px; font-size: 1.1rem; transition: 0.3s; }
        .btn:hover { background: #fff; transform: scale(1.05); }

        /* SERVICES SECTION */
        section { padding: 80px 20px; max-width: 1200px; margin: auto; }
        h2 { color: #FFD700; text-align: center; margin-bottom: 50px; font-size: 2.8rem; }
        .services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .card { background: #1a1a1a; padding: 35px 25px; border-radius: 15px; border: 2px solid #FFD700; text-align: center; transition: 0.3s; }
        .card:hover { transform: translateY(-10px); background: #222; }
        .card h3 { color: #FFD700
